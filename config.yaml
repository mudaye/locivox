model:
  engine: faster-whisper
  size: base
  device: cpu
  compute_type: int8
  language: en
audio:
  sample_rate: 16000
  channels: 1
  chunk_duration: 5
  silence_threshold: 0.01
vad:
  enabled: true
  threshold: 0.5
recording:
  format: wav
  auto_stop: false
  max_duration: 3600
streaming:
  enabled: true
  chunk_size: 5.0
  chunk_overlap: 1.0
  vad_enabled: true
  vad_threshold: 0.5
  buffer_size: 10
  min_speech_duration: 0.5
batch:
  extensions:
  - .wav
  - .mp3
  - .flac
  - .m4a
  - .ogg
  - .opus
  recursive: false
  overwrite: false
  show_progress: true
  save_report: false
  report_file: ./batch_report.json
watcher:
  poll_interval: 2.0
  process_existing: false
  extensions:
  - .wav
  - .mp3
  - .flac
  - .m4a
  - .ogg
  - .opus
output:
  directory: ./output
  format: txt
  timestamp: true
  include_timestamps: false
vocabulary:
  enabled: true
  file: ./vocabulary.txt
  case_sensitive: false
  matching:
    library: jellyfish
    fuzzy_threshold: 0.85
    abydos_algorithm: DoubleMetaphone
logging:
  level: INFO
  file: ./logs/locivox.log
  console: true
analytics:
  auto_export: true
  keep_sessions: 30
  export_dir: ./analytics
